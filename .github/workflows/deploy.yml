name: Build and deploy to GitHub Pages

# Pull requests run the same build and checks as a deploy, private assets
# included, so an issue is verified before its merge. Only main deploys.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running check; on main, runs queue.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A secret cannot be read in a step condition; only whether it exists is.
      # Pull requests from forks do not receive it and build the placeholder.
      HAS_ASSETS_KEY: ${{ secrets.ASSETS_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the photo check reads every commit of the PR.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Photo and brand files from the private repository (ADR-0010), with a
      # read-only deploy key scoped to it.
      - name: Fetch private assets
        if: env.HAS_ASSETS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: FilipeOliveira94/dra-victoria-laufer-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: .assets
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        id: build
        run: npm run build
      - name: Check the portrait and favicon are in the build
        if: env.HAS_ASSETS_KEY == 'true'
        run: grep -q '<picture>' dist/index.html && grep -q 'rel="icon" href="/_astro/icon' dist/index.html
      # Quality checks (issue 1.7). Each runs even if an earlier one failed,
      # so one run reports every broken rule; any failure fails the job, and
      # on main that stops the deploy.
      - name: Check every referenced request and anchor, and images ≤ 200 KB
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-requests.mjs
      - name: Check valid HTML, no Lorem or vetoed term, no photo in the repository
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lint
      - name: Check accessibility with axe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-axe.mjs
      # Mobile, on the real photo when the assets were fetched; on the
      # placeholder for pull requests from forks.
      - name: Check Lighthouse mobile
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lighthouse
      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.event.number || github.sha }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
      # The exact site a merge would publish, to download from the run.
      - name: Upload the built site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-pr-${{ github.event.number }}
          path: dist
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a running deployment is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The published-site check: the run is the evidence, no document commit.
  published:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Retries cover the CDN serving the previous page for a short while.
      - name: Check the published page and everything it loads
        run: |
          for attempt in 1 2 3 4; do
            node scripts/check-requests.mjs "${{ needs.deploy.outputs.page_url }}" && exit 0
            sleep 30
          done
          exit 1
