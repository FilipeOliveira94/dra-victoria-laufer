name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Staging under /dra-victoria-laufer/ (ADR-0004). Issue 3.2 removes
      # this line to build for https://dravictorialaufer.com.br/.
      DEPLOY_TARGET: ghpages
      # A secret cannot be read in a step condition; only whether it exists is.
      HAS_ASSETS_KEY: ${{ secrets.ASSETS_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Photo and brand files from the private repository (ADR-0010), with a
      # read-only deploy key scoped to it. Without the secret (fork) the step
      # is skipped and the build uses the neutral placeholder.
      - name: Fetch private assets
        if: env.HAS_ASSETS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: FilipeOliveira94/dra-victoria-laufer-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: .assets
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check every referenced request returns 200
        run: node scripts/check-requests.mjs /dra-victoria-laufer/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
